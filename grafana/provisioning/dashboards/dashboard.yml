apiVersion: 1

providers:
- name: 'Prometheus'
  orgId: 1
  folder: ''
  type: file
  disableDeletion: false
  editable: true
  allowUiUpdates: true
  options:
    # Grafana loads every dashboard JSON found under this path. There is no
    # per-file allowlist in the provisioning schema, so the "files:" list that
    # used to sit here was inert: Fastly-Top-Domains.json was never in it and
    # provisioned anyway. Removed so it cannot drift again.
    path: /etc/grafana/provisioning/dashboards
