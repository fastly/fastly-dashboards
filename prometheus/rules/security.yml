groups:
  - name: security
    rules:
      # DDoS mitigation
      - record: fastly_service:ddos_mitigation_count
        expr: sum(rate(fastly_rt_ddos_protection_requests_mitigate_total[120s])) by (service_id,service_name)
      # Bot challenges (example, extend as needed)
      - record: fastly_service:bot_challenges_failed
        expr: sum(rate(fastly_rt_bot_challenges_failed_total[120s])) by (service_id,service_name)
      # Attack events (example, extend as needed)
      - record: fastly_service:attack_blocked_req_body_bytes
        expr: sum(rate(fastly_rt_attack_blocked_req_body_bytes_total[120s])) by (service_id,service_name)
